<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NXTGEN | Guess the Land Animal — Day 6</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',Arial,sans-serif;color:#183b36}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#fef3a6 0 9%,transparent 10%),linear-gradient(160deg,#d6f8f1,#ecf9c6 55%,#d2f0b0);display:flex;justify-content:center;align-items:center;padding:15px}.app{width:min(1100px,100%);min-height:min(720px,95vh);background:#fffdf5;border:7px solid #fff;border-radius:32px;box-shadow:0 20px 60px #296a5840;display:flex;flex-direction:column;overflow:hidden}.top{background:#167e70;color:white;padding:17px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:1000;letter-spacing:1px;font-size:clamp(16px,2.3vw,26px)}.tag{background:#ffe06b;color:#3e4924;border-radius:100px;padding:9px 17px;font-weight:900;font-size:clamp(12px,1.7vw,18px)}.body{padding:18px 28px;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}h1{font-size:clamp(30px,5vw,60px);margin:2px 0 0;color:#156e60;line-height:1.08}.sub{font-size:clamp(15px,2vw,22px);margin:0;color:#55766c}.stage{width:100%;flex:1;min-height:280px;background:linear-gradient(#ecfbff 0 65%,#c6e99b 65%);border:4px dashed #a5d3bd;border-radius:26px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:20px;gap:20px}.mystery{font-size:clamp(110px,20vw,240px);font-weight:1000;color:#55a58c;line-height:1;filter:drop-shadow(0 8px 0 #fff8);user-select:none}.animal{font-size:clamp(100px,18vw,210px);line-height:1;filter:drop-shadow(0 10px 4px #0002);animation:pop .35s ease}.cluebox{background:#fff;border-radius:22px;padding:24px 15px;box-shadow:0 8px 20px #237d5922}.small{font-size:clamp(15px,2vw,23px);color:#167e70;font-weight:900}.clue{font-size:clamp(22px,3.5vw,41px);font-weight:900;line-height:1.22;margin:12px 0}.answer{font-size:clamp(28px,4vw,50px);color:#116b57;font-weight:1000}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;width:100%;padding:2px 0 8px}button{border:0;border-radius:16px;padding:14px 22px;font-size:clamp(15px,2vw,21px);font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0002;transition:transform .12s}button:active{transform:translateY(3px)}.primary{background:#ffcb47;color:#4c3b12}.green{background:#168e78;color:white}.blue{background:#bce5f8;color:#235471}.muted{background:#edf1e9;color:#456057}.footer{padding:12px 20px;background:#f2fae9;text-align:center;font-size:clamp(14px,1.8vw,19px);font-weight:800;color:#477052}.count{font-weight:900;font-size:16px;color:#568479}.hidden{display:none!important}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:650px){.app{min-height:94vh}.body{padding:15px}.stage{grid-template-columns:1fr;gap:4px;padding:12px}.mystery,.animal{font-size:110px}.cluebox{padding:12px}.clue{margin:6px 0}button{padding:12px 14px}}
</style></head><body><main class="app"><header class="top"><div class="brand">🌟 NXTGEN • GOD'S AMAZING CREATION</div><div class="tag">DAY 6 • LAND ANIMALS</div></header><section class="body"><h1>🦁 Guess the Land Animal!</h1><p class="sub">Listen to the clues. Raise your hand when you know!</p><div class="count" id="count"></div><div class="stage"><div id="picture" class="mystery" aria-live="polite">?</div><div class="cluebox"><div class="small" id="label">CLUE 1</div><div class="clue" id="clue" aria-live="polite"></div><div class="answer hidden" id="answer"></div></div></div><div class="buttons"><button class="blue" id="clueBtn" onclick="moreClue()">💡 Next Clue</button><button class="primary" id="revealBtn" onclick="reveal()">👀 Reveal Animal!</button><button class="green" onclick="nextAnimal()">➡️ Next Animal</button><button class="muted" onclick="restart()">↺ Start Over</button><button class="muted" onclick="document.documentElement.requestFullscreen?.()">⛶ Fullscreen</button></div></section><footer class="footer">✨ God made the land animals on Day 6! • Genesis 1:24–25 ✨</footer></main><script>
const animals=[{name:'ELEPHANT',emoji:'🐘',clues:['I am very BIG!','I have a long trunk.','I have two big ears.']},{name:'LION',emoji:'🦁',clues:['I have four legs.','I make a loud ROAR!','I have a big furry mane.']},{name:'GIRAFFE',emoji:'🦒',clues:['I am very tall.','I have a very long neck.','I have brown spots.']},{name:'RABBIT',emoji:'🐰',clues:['I am small and fluffy.','I have long ears.','I like to hop, hop, hop!']},{name:'MONKEY',emoji:'🐒',clues:['I love to climb.','I have a long tail.','I swing in trees!']},{name:'HORSE',emoji:'🐴',clues:['I have four strong legs.','People can ride on my back.','I say NEIGH!']},{name:'COW',emoji:'🐄',clues:['I like to eat grass.','I live on a farm.','I say MOO!']},{name:'SHEEP',emoji:'🐑',clues:['I live on a farm.','I have soft, woolly fur.','I say BAA!']},{name:'DOG',emoji:'🐕',clues:['I can be your pet.','I wag my tail when happy.','I say WOOF!']},{name:'CAT',emoji:'🐈',clues:['I have whiskers.','I like to nap and purr.','I say MEOW!']},{name:'BEAR',emoji:'🐻',clues:['I am big and furry.','I have strong paws.','I sometimes like to eat honey.']},{name:'DINOSAUR',emoji:'🦕',clues:['I lived a very long time ago.','Some of my kind were very big.','You can learn about me from fossils!']}];
let index=0,step=0,shown=false;function render(){const a=animals[index];document.getElementById('count').textContent=`ANIMAL ${index+1} OF ${animals.length}`;document.getElementById('picture').textContent=shown?a.emoji:'?';document.getElementById('picture').className=shown?'animal':'mystery';document.getElementById('label').textContent=shown?'GREAT JOB!':`CLUE ${step+1}`;document.getElementById('clue').textContent=shown?'Who made this animal? GOD DID!':a.clues[step];document.getElementById('answer').textContent=a.name;document.getElementById('answer').classList.toggle('hidden',!shown);document.getElementById('clueBtn').disabled=shown||step===a.clues.length-1;document.getElementById('clueBtn').style.opacity=shown||step===a.clues.length-1?'.45':'1';document.getElementById('revealBtn').disabled=shown;document.getElementById('revealBtn').style.opacity=shown?'.45':'1'}function moreClue(){if(!shown&&step<animals[index].clues.length-1){step++;render()}}function reveal(){shown=true;render()}function nextAnimal(){index=(index+1)%animals.length;step=0;shown=false;render()}function restart(){index=0;step=0;shown=false;render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(!shown&&step<2)moreClue();else if(!shown)reveal();else nextAnimal()}if(e.key==='ArrowLeft')nextAnimal();if(e.key==='Enter')reveal()});render();
</script></body></html>
